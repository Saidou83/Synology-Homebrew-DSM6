name: Mirror to GitLab

on:
  push:
    branches: [master]
  workflow_dispatch: {}

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure deploy key
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "$GITLAB_MIRROR_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # Host key is pinned (not TOFU'd at runtime) but kept out of the
          # public workflow source, since it also identifies the domain.
          echo "$GITLAB_KNOWN_HOST" > ~/.ssh/known_hosts
        env:
          GITLAB_MIRROR_SSH_KEY: ${{ secrets.GITLAB_MIRROR_SSH_KEY }}
          GITLAB_KNOWN_HOST: ${{ secrets.GITLAB_KNOWN_HOST }}

      - name: Push master to GitLab (fast-forward only)
        run: |
          git remote add gitlab "$GITLAB_REMOTE_URL"
          git push gitlab HEAD:refs/heads/master
        env:
          GITLAB_REMOTE_URL: ${{ secrets.GITLAB_REMOTE_URL }}
